name: DH Live Preview
on:
  workflow_dispatch:
    inputs:
      sid: { description: session id, required: true }
      dh_base: { description: DH callback base URL, required: true }
      token: { description: session token, required: true }
      branch: { description: branch, required: true }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        working-directory: dh-android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write live session script
        run: |
          cat > /tmp/live_session.sh <<'DHSH'
          set +e
          adb wait-for-device
          RP="$DH/api/preview/session/$SID"
          report(){ curl -s -X POST "$RP/report" -H "X-Session-Token: $TOK" -H 'Content-Type: application/json' -d "$1" >/dev/null; }
          launch(){ adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1; }
          getsize(){ WH=$(adb shell wm size | tr -d '\r' | grep -oE '[0-9]+x[0-9]+' | tail -1); W=${WH%x*}; H=${WH#*x}; [ -z "$W" ] && W=1080; [ -z "$H" ] && H=1920; }
          px(){ awk "BEGIN{printf \"%d\", $1*$2}"; }
          pushframe(){ adb exec-out screencap -p > /tmp/frame.png 2>/dev/null; curl -s -X POST "$RP/frame?w=$W&h=$H" -H "X-Session-Token: $TOK" -F "frame=@/tmp/frame.png" >/dev/null; }
          report '{"status":"installing"}'
          adb install -r "$APK"
          report '{"status":"restarting"}'
          launch
          sleep 2
          getsize
          SERIAL=$(adb devices | awk 'NR==2{print $1}')
          API=$(adb shell getprop ro.build.version.sdk | tr -d '\r')
          SHA=$(git rev-parse HEAD 2>/dev/null | cut -c1-10)
          report "{\"status\":\"live\",\"api_level\":\"$API\",\"serial\":\"$SERIAL\",\"commit_sha\":\"$SHA\",\"run_id\":\"$GITHUB_RUN_ID\"}"
          pushframe
          for i in $(seq 1 4000); do
            curl -s "$RP/pull" -H "X-Session-Token: $TOK" > /tmp/pull.txt 2>/dev/null
            grep -q '^stop$' /tmp/pull.txt && break
            if grep -q '^reload' /tmp/pull.txt; then
              KIND=$(grep '^reload' /tmp/pull.txt | head -1 | awk '{print $2}')
              report '{"status":"building"}'; git fetch origin "$BR"; git reset --hard "origin/$BR"
              if [ "$KIND" = "full" ]; then report '{"status":"reinstalling"}'; ( cd dh-android && gradle assembleDebug --no-daemon ); adb install -r "$APK"; else report '{"status":"applying_changes"}'; ( cd dh-android && gradle installDebug --no-daemon ); fi
              launch; sleep 1; getsize; report '{"status":"reconnected"}'; report '{"status":"live"}'
            fi
            while IFS= read -r line; do
              set -- $line
              case "$1" in
                cmd)
                  case "$2" in
                    back) adb shell input keyevent 4;;
                    home) adb shell input keyevent 3;;
                    restart) adb shell am force-stop "$PKG"; launch;;
                    clear) adb shell pm clear "$PKG"; launch;;
                    rotate) R=$(adb shell settings get system user_rotation | tr -d '\r'); NR=1; [ "$R" = "1" ] && NR=0; adb shell settings put system accelerometer_rotation 0; adb shell settings put system user_rotation $NR; sleep 1; getsize;;
                    logcat) adb logcat -d -t 200 > /tmp/lg.txt 2>/dev/null; curl -s -X POST "$RP/logcat" -H "X-Session-Token: $TOK" -H 'Content-Type: text/plain' --data-binary @/tmp/lg.txt >/dev/null;;
                  esac;;
                T) adb shell input tap $(px $2 $W) $(px $3 $H);;
                D) DX=$(px $2 $W); DY=$(px $3 $H); adb shell input tap $DX $DY; adb shell input tap $DX $DY;;
                L) LX=$(px $2 $W); LY=$(px $3 $H); adb shell input swipe $LX $LY $LX $LY $4;;
                S) adb shell input swipe $(px $2 $W) $(px $3 $H) $(px $4 $W) $(px $5 $H) $6;;
                K) adb shell input keyevent $2;;
                X) adb shell input text "$2";;
              esac
            done < /tmp/pull.txt
            PROC=$(adb shell pidof "$PKG" | tr -d '\r'); ST="running"; [ -z "$PROC" ] && ST="crashed"
            curl -s -X POST "$RP/heartbeat?status=$ST" -H "X-Session-Token: $TOK" >/dev/null
            pushframe
            sleep 0.5
          done
          report '{"status":"disconnected"}'
          DHSH
          chmod +x /tmp/live_session.sh
      - name: Live interactive emulator session
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DH: ${{ inputs.dh_base }}
          SID: ${{ inputs.sid }}
          TOK: ${{ inputs.token }}
          BR: ${{ inputs.branch }}
          PKG: host.dh.app
          APK: dh-android/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash /tmp/live_session.sh
