name: DH Live Preview
on:
  workflow_dispatch:
    inputs:
      sid: { description: session id, required: true }
      dh_base: { description: DH callback base URL, required: true }
      token: { description: session token, required: true }
      branch: { description: branch, required: true }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install cloudflared + ws-scrcpy
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          git clone --depth 1 https://github.com/NetrisTV/ws-scrcpy.git /opt/ws-scrcpy
          cd /opt/ws-scrcpy && npm ci && npm run dist
      - name: Build debug APK
        working-directory: dh-android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Live interactive emulator session
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DH: ${{ inputs.dh_base }}
          SID: ${{ inputs.sid }}
          TOK: ${{ inputs.token }}
          BR: ${{ inputs.branch }}
          PKG: host.dh.app
          APK: dh-android/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            rep() { curl -s -X POST "$DH/api/preview/session/$SID/report" -H "X-Session-Token: $TOK" -H 'Content-Type: application/json' -d "$1" >/dev/null; }
            rep '{"status":"installing"}'
            adb install -r "$APK"
            rep '{"status":"restarting"}'
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            cd /opt/ws-scrcpy && (WS_SCRCPY_PORT=8000 node dist/index.js > /tmp/ws.log 2>&1 &)
            sleep 6
            cloudflared tunnel --no-autoupdate --url http://localhost:8000 > /tmp/cf.log 2>&1 &
            URL=""
            for i in $(seq 1 40); do URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1); [ -n "$URL" ] && break; sleep 2; done
            SERIAL=$(adb devices | awk 'NR==2{print $1}')
            API=$(adb shell getprop ro.build.version.sdk | tr -d '\r')
            SHA=$(git rev-parse HEAD 2>/dev/null | cut -c1-10)
            rep "{\"status\":\"live\",\"tunnel_url\":\"$URL\",\"api_level\":\"$API\",\"serial\":\"$SERIAL\",\"commit_sha\":\"$SHA\",\"run_id\":\"$GITHUB_RUN_ID\"}"
            # DH-controlled keepalive loop (~5s cadence). Ends on stop/idle.
            for i in $(seq 1 600); do
              RESP=$(curl -s "$DH/api/preview/session/$SID/poll" -H "X-Session-Token: $TOK")
              echo "$RESP" | grep -q '"continue":false' && break
              echo "$RESP" | grep -q '"continue": false' && break
              PROC=$(adb shell pidof "$PKG" | tr -d '\r'); ST="running"; [ -z "$PROC" ] && ST="crashed"
              # execute queued real adb controls
              for c in $(echo "$RESP" | grep -oE '"cmds":\[[^]]*\]' | grep -oE '"[a-z_]+"' | tr -d '"'); do
                case "$c" in
                  cmds) : ;;
                  back) adb shell input keyevent 4 ;;
                  home) adb shell input keyevent 3 ;;
                  rotate) R=$(adb shell settings get system user_rotation | tr -d '\r'); NR=1; [ "$R" = "1" ] && NR=0; adb shell settings put system accelerometer_rotation 0; adb shell settings put system user_rotation $NR ;;
                  restart) adb shell am force-stop "$PKG"; adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 ;;
                  clear) adb shell pm clear "$PKG"; adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 ;;
                  logcat) LG=$(adb logcat -d -t 200 2>/dev/null | tail -c 6000); curl -s -X POST "$DH/api/preview/session/$SID/logcat" -H "X-Session-Token: $TOK" -H 'Content-Type: text/plain' --data-binary "$LG" >/dev/null ;;
                  reload) rep '{"status":"building"}'; git fetch origin "$BR" && git reset --hard "origin/$BR"; (cd dh-android && gradle assembleDebug --no-daemon); rep '{"status":"installing"}'; adb install -r "$APK"; adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1; rep '{"status":"live"}' ;;
                esac
              done
              adb exec-out screencap -p > /tmp/frame.png 2>/dev/null
              curl -s -X POST "$DH/api/preview/session/$SID/heartbeat?status=$ST" -H "X-Session-Token: $TOK" -F "frame=@/tmp/frame.png" >/dev/null
              sleep 5
            done
            rep '{"status":"disconnected"}'
