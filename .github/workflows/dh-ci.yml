name: DH CI
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DH verification (intentional failure)
        run: |
          echo "DH controlled failure at $(date -u)" > dh-evidence.txt
          echo "commit: $GITHUB_SHA" >> dh-evidence.txt
          echo "run: $GITHUB_RUN_ID" >> dh-evidence.txt
          cat dh-evidence.txt
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dh-evidence
          path: dh-evidence.txt
