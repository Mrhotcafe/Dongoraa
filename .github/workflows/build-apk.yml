name: Remote APK Builder

on:
  repository_dispatch:
    types: [trigger-apk-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch project source (exported from the app)
        run: |
          curl -L "${{ github.event.client_payload.source_url }}" -o source.zip
          mkdir project && unzip -q source.zip -d source_unzipped
          inner=$(ls -d source_unzipped/*/ | head -n1)
          cp -R "$inner". project/
          ls -la project

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps & prebuild native Android project
        working-directory: project
        run: |
          npm install
          npx expo prebuild -p android --no-install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: project/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Sign release APK (Play Store ready)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No release keystore secret found — leaving the debug-signed APK as-is."
            APK=$(find project/android/app/build/outputs/apk/release -name "*.apk" | head -n1)
            mkdir -p project/dist && cp "$APK" project/dist/app-release.apk
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          APK_IN=$(find project/android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          "${BUILD_TOOLS}zipalign" -f -p 4 "$APK_IN" /tmp/aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out /tmp/app-release-signed.apk \
            /tmp/aligned.apk
          "${BUILD_TOOLS}apksigner" verify --verbose /tmp/app-release-signed.apk
          mkdir -p project/dist
          cp /tmp/app-release-signed.apk project/dist/app-release.apk

      - name: Publish APK as a Release and notify the app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find project/dist -name "*.apk" | head -n1)
          TAG="apk-${{ github.event.client_payload.job_id }}"
          echo "Publishing $APK as release $TAG"
          gh release create "$TAG" "$APK" --repo "${{ github.repository }}" --title "$TAG" --notes "Automated signed APK build"
          URL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[0].url')
          echo "Asset URL: $URL"
          curl --fail-with-body --retry 3 -X POST "${{ github.event.client_payload.callback_url }}" \
            -H "Authorization: Bearer ${{ secrets.BUILD_CALLBACK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"apk_url\":\"$URL\"}"
